<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClawdBot Control Centre</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --orange: #db6d28;
    --purple: #bc8cff;
    --cyan: #39d2c0;
    --pink: #f778ba;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px;
  }
  .header-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .header h1 { font-size: 22px; font-weight: 600; }
  .status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 500;
  }
  .status-online { background: rgba(63,185,80,0.15); color: var(--green); }
  .status-offline { background: rgba(248,81,73,0.15); color: var(--red); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; }
  .status-online .status-dot { background: var(--green); animation: pulse 2s infinite; }
  .status-offline .status-dot { background: var(--red); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .header-right { text-align: right; font-size: 13px; color: var(--text-dim); }
  .refresh-bar {
    height: 3px; background: var(--accent); border-radius: 2px;
    margin-top: 4px; transition: width 1s linear;
  }
  .provider-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .provider-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 16px; font-size: 11px; font-weight: 600;
  }
  .provider-badge.openai { background: rgba(63,185,80,0.12); color: var(--green); }
  .provider-badge.anthropic { background: rgba(219,109,40,0.12); color: var(--orange); }
  .provider-badge.unknown { background: rgba(88,166,255,0.12); color: var(--accent); }
  .live-counter { font-variant-numeric: tabular-nums; }

  /* Meta row */
  .meta-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .meta-chip {
    background: var(--surface); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 8px; font-size: 13px;
  }
  .meta-chip .label { color: var(--text-dim); margin-right: 6px; }
  .meta-chip .value { color: var(--text); font-weight: 500; }
  .meta-chip .value.green { color: var(--green); }
  .meta-chip .value.yellow { color: var(--yellow); }
  .meta-chip .value.red { color: var(--red); }

  /* Cards grid */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px; margin-bottom: 24px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .card-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .card-value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .card-explainer { font-size: 11px; color: var(--text-dim); margin-top: 6px; font-style: italic; line-height: 1.4; }
  .card-value.cost { color: var(--green); }
  .card-provider-split { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; }
  .card-provider-split span { display: flex; align-items: center; gap: 4px; }
  .card-provider-split .dot {
    width: 6px; height: 6px; border-radius: 50%; display: inline-block;
  }

  /* Two-column layout */
  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 900px) { .columns { grid-template-columns: 1fr; } }

  /* Section panels */
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .panel-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
  }
  .panel-body { padding: 0; max-height: 500px; overflow-y: auto; }
  .panel-body-tall { padding: 0; max-height: 800px; overflow-y: auto; }
  .panel-empty {
    padding: 30px 20px; text-align: center; color: var(--text-dim); font-size: 13px;
  }

  /* AI Summary section */
  .summary-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px 24px; margin-bottom: 24px;
  }
  .summary-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .summary-header h2 { font-size: 16px; font-weight: 600; }
  .summary-header .generated { font-size: 11px; color: var(--text-dim); }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .summary-grid { grid-template-columns: 1fr; } }
  .summary-block h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--accent); margin-bottom: 10px;
  }
  .summary-bullets { list-style: none; }
  .summary-bullets li {
    padding: 5px 0; font-size: 13px; color: var(--text);
    display: flex; align-items: flex-start; gap: 8px;
  }
  .summary-bullets li::before {
    content: '\25CF'; color: var(--accent); font-size: 8px; margin-top: 5px; flex-shrink: 0;
  }
  .summary-24h { font-size: 13px; color: var(--text); line-height: 1.6; }

  /* Git timeline */
  .timeline { list-style: none; position: relative; padding-left: 24px; }
  .timeline::before {
    content: ''; position: absolute; left: 7px; top: 8px; bottom: 8px;
    width: 2px; background: var(--border);
  }
  .timeline-item {
    position: relative; padding: 8px 0 8px 16px; font-size: 13px;
  }
  .timeline-item::before {
    content: ''; position: absolute; left: -20px; top: 14px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--accent);
  }
  .timeline-item.repo-website::before { border-color: var(--green); }
  .timeline-item.repo-workspace-reception::before { border-color: var(--orange); }
  .timeline-item.repo-workspace::before { border-color: var(--purple); }
  .timeline-msg { color: var(--text); font-weight: 500; }
  .timeline-meta { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
  .timeline-hash {
    font-family: monospace; font-size: 11px; padding: 1px 5px;
    background: rgba(88,166,255,0.1); border-radius: 3px; color: var(--accent);
  }
  .timeline-repo {
    font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 600;
    text-transform: uppercase;
  }
  .repo-website { background: rgba(63,185,80,0.1); color: var(--green); }
  .repo-workspace-reception { background: rgba(219,109,40,0.1); color: var(--orange); }
  .repo-workspace { background: rgba(188,140,255,0.1); color: var(--purple); }

  /* Breakdown tables */
  .breakdown-table { width: 100%; border-collapse: collapse; }
  .breakdown-table th {
    text-align: left; padding: 10px 16px; font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border);
  }
  .breakdown-table td {
    padding: 10px 16px; font-size: 13px; border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  .breakdown-table tr:last-child td { border-bottom: none; }
  .model-name { font-weight: 500; color: var(--accent); }
  .provider-openai { color: var(--green); }
  .provider-anthropic { color: var(--orange); }
  .current-tag {
    display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px;
    font-weight: 600; background: rgba(63,185,80,0.15); color: var(--green);
    margin-left: 6px; vertical-align: middle; text-transform: uppercase;
  }

  /* Events */
  .event-list { list-style: none; }
  .event-item {
    display: flex; gap: 12px; padding: 10px 20px;
    border-bottom: 1px solid var(--border); font-size: 13px; align-items: flex-start;
  }
  .event-item:last-child { border-bottom: none; }
  .event-time { color: var(--text-dim); white-space: nowrap; min-width: 70px; font-variant-numeric: tabular-nums; }
  .event-badge {
    padding: 1px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;
    white-space: nowrap; text-transform: uppercase;
  }
  .badge-info { background: rgba(88,166,255,0.15); color: var(--accent); }
  .badge-error { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge-warning { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .badge-heartbeat { background: rgba(188,140,255,0.15); color: var(--purple); }
  .badge-whatsapp { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge-browser { background: rgba(219,109,40,0.15); color: var(--orange); }
  .badge-delivery { background: rgba(88,166,255,0.15); color: var(--accent); }
  .event-msg { color: var(--text); word-break: break-word; }

  /* Sessions table */
  .sessions-table { width: 100%; border-collapse: collapse; }
  .sessions-table th {
    text-align: left; padding: 10px 16px; font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--surface);
  }
  .sessions-table td {
    padding: 10px 16px; font-size: 13px; border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  .sessions-table tr:last-child td { border-bottom: none; }
  .channel-badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .channel-whatsapp { background: rgba(63,185,80,0.15); color: var(--green); }
  .channel-web { background: rgba(88,166,255,0.15); color: var(--accent); }

  /* Messages */
  .msg-item {
    display: flex; gap: 12px; padding: 10px 20px;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .msg-item:last-child { border-bottom: none; }
  .msg-role {
    padding: 1px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
    white-space: nowrap; min-width: 60px; text-align: center; height: fit-content;
  }
  .role-user { background: rgba(88,166,255,0.15); color: var(--accent); }
  .role-assistant { background: rgba(188,140,255,0.15); color: var(--purple); }
  .role-tool { background: rgba(57,210,192,0.1); color: var(--cyan); }
  .msg-text { color: var(--text); word-break: break-word; }
  .msg-meta { color: var(--text-dim); font-size: 11px; margin-top: 2px; }

  /* Tool calls */
  .tool-item {
    display: flex; gap: 12px; padding: 8px 20px;
    border-bottom: 1px solid var(--border); font-size: 13px; align-items: flex-start;
  }
  .tool-item:last-child { border-bottom: none; }
  .tool-name {
    padding: 1px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
    white-space: nowrap; background: rgba(57,210,192,0.15); color: var(--cyan);
  }
  .tool-name.exec-claude { background: rgba(219,109,40,0.15); color: var(--orange); }
  .tool-args { color: var(--text-dim); font-size: 12px; word-break: break-all; font-family: monospace; }

  /* Claude Code */
  .claude-section-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
    background: rgba(219,109,40,0.05);
  }
  .cc-session { border-bottom: 1px solid var(--border); }
  .cc-session:last-child { border-bottom: none; }
  .cc-session-summary {
    padding: 12px 20px; cursor: pointer; display: flex; justify-content: space-between;
    align-items: center; transition: background 0.15s;
  }
  .cc-session-summary:hover { background: rgba(255,255,255,0.02); }
  .cc-session-meta { font-size: 12px; color: var(--text-dim); }
  .cc-session-expand { color: var(--text-dim); font-size: 12px; transition: transform 0.2s; }
  .cc-session-expand.open { transform: rotate(90deg); }
  .cc-session-detail {
    display: none; border-top: 1px solid var(--border); background: rgba(0,0,0,0.15);
  }
  .cc-session-detail.open { display: block; }
  .cc-tool-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .cc-tool-chip {
    padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 500;
    background: rgba(57,210,192,0.1); color: var(--cyan);
  }
  .cc-conversation { padding: 12px 20px; max-height: 600px; overflow-y: auto; }
  .cc-msg {
    display: flex; gap: 10px; padding: 6px 0; font-size: 13px; align-items: flex-start;
  }
  .cc-msg + .cc-msg { border-top: 1px solid rgba(48,54,61,0.5); }
  .cc-msg-role {
    padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600;
    white-space: nowrap; min-width: 55px; text-align: center; flex-shrink: 0; margin-top: 2px;
  }
  .cc-msg-text { word-break: break-word; white-space: pre-wrap; font-size: 12px; line-height: 1.5; }
  .cc-tool-calls-section { padding: 8px 20px; border-top: 1px solid var(--border); }
  .cc-tool-calls-section summary {
    cursor: pointer; font-size: 12px; color: var(--text-dim); padding: 4px 0;
  }
  .cc-tc-item {
    display: flex; gap: 8px; padding: 3px 0; font-size: 11px; align-items: flex-start;
  }

  /* Health cards */
  .health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; padding: 16px; }
  .health-item { text-align: center; }
  .health-value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .health-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-top: 2px; }

  /* Loading / error */
  .loading { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .error-banner {
    background: rgba(248,81,73,0.1); border: 1px solid var(--red);
    border-radius: 8px; padding: 12px 20px; margin-bottom: 20px;
    color: var(--red); font-size: 14px;
  }

  .full-width { margin-bottom: 24px; }
</style>
</head>
<body>

<div id="app">
  <div class="loading">Loading dashboard data...</div>
</div>

<script>
const REFRESH_INTERVAL = 60;
let countdown = REFRESH_INTERVAL;
let data = null;
let dataFetchedAt = Date.now();
const expandedSessions = new Set();

function fmt(n) {
  if (n === null || n === undefined) return '\u2014';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
  return n.toLocaleString();
}

function fmtCost(n) {
  if (n === null || n === undefined) return '\u2014';
  return '$' + n.toFixed(4);
}

function fmtTime(iso) {
  if (!iso) return '\u2014';
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function fmtDateTime(iso) {
  if (!iso) return '\u2014';
  const d = new Date(iso);
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' +
         d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function fmtRelativeSecs(iso) {
  if (!iso) return '\u2014';
  const diff = Date.now() - new Date(iso).getTime();
  if (diff < 0) return 'just now';
  const secs = Math.floor(diff / 1000);
  if (secs < 60) return secs + 's ago';
  const mins = Math.floor(secs / 60);
  if (mins < 60) return mins + 'm ' + (secs % 60) + 's ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ' + (mins % 60) + 'm ago';
  return Math.floor(hrs / 24) + 'd ' + (hrs % 24) + 'h ago';
}

function fmtUptime(ms) {
  if (!ms) return '\u2014';
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h > 24) {
    const d = Math.floor(h / 24);
    return d + 'd ' + (h % 24) + 'h ' + m + 'm';
  }
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm ' + (s % 60) + 's';
}

function fmtDuration(start, end) {
  if (!start || !end) return '\u2014';
  const ms = new Date(end) - new Date(start);
  if (ms < 1000) return '<1s';
  return fmtUptime(ms);
}

function esc(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function badgeClass(category) {
  const map = {
    error: 'badge-error', warning: 'badge-warning', heartbeat: 'badge-heartbeat',
    whatsapp: 'badge-whatsapp', browser: 'badge-browser', delivery: 'badge-delivery',
  };
  return map[category] || 'badge-info';
}

function ccRoleClass(role) {
  if (role === 'user') return 'role-user';
  if (role === 'assistant') return 'role-assistant';
  if (role === 'tool_result') return 'role-tool';
  return 'role-assistant';
}

function toggleCcSession(id) {
  if (expandedSessions.has(id)) expandedSessions.delete(id);
  else expandedSessions.add(id);
  render();
}

function providerClass(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('openai')) return 'openai';
  if (n.includes('anthropic')) return 'anthropic';
  return 'unknown';
}

function repoClass(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('reception')) return 'workspace-reception';
  if (n === 'website') return 'website';
  return 'workspace';
}

function render() {
  if (!data) return;
  const st = data.status || {};
  const tk = data.tokens || {};
  const isOnline = st.lastHeartbeat &&
    (Date.now() - new Date(st.lastHeartbeat).getTime() < 20 * 60 * 1000);

  let html = '';

  // ── Header ──
  const providers = Object.keys(data.byProvider || {});
  const models = data.byModel || {};
  html += `<div class="header">
    <div class="header-left">
      <h1>ClawdBot</h1>
      <span class="status-badge ${isOnline ? 'status-online' : 'status-offline'}">
        <span class="status-dot"></span>
        ${isOnline ? 'Online' : 'Offline'}
      </span>
      <div class="provider-badges">`;
  for (const p of providers) {
    const pd = data.byProvider[p];
    html += `<span class="provider-badge ${providerClass(p)}">${esc(p)} ${fmtCost(pd.cost)}</span>`;
  }
  // Show active model(s) with "active" tag
  for (const [m, md] of Object.entries(models)) {
    if (md.isCurrent) {
      html += `<span class="provider-badge openai">${esc(m)} <span class="current-tag">active</span></span>`;
    }
  }
  html += `</div>
    </div>
    <div class="header-right">
      <div class="live-counter" data-relative="${esc(data.generatedAt)}">Updated ${esc(fmtRelativeSecs(data.generatedAt))}</div>
      <div class="refresh-bar" id="refreshBar" style="width: ${(countdown / REFRESH_INTERVAL * 100)}%"></div>
    </div>
  </div>`;

  // ── Health Status Row ──
  const messagesHandled = st.messagesHandled || 0;
  const lastHb = (data.heartbeats || []).slice(-1)[0];
  const reconnects = lastHb ? (lastHb.reconnectAttempts || 0) : 0;
  const lastMsgAt = lastHb ? lastHb.lastMessageAt : null;

  html += `<div class="meta-row">
    <div class="meta-chip"><span class="label">Uptime</span><span class="value">${fmtUptime(st.uptimeMs)}</span></div>
    <div class="meta-chip"><span class="label">WhatsApp</span><span class="value ${st.whatsapp === 'connected' ? 'green' : st.whatsapp === 'connecting' ? 'yellow' : 'red'}">${esc(st.whatsapp)}</span></div>
    <div class="meta-chip"><span class="label">Messages Handled</span><span class="value">${messagesHandled}</span></div>
    <div class="meta-chip"><span class="label">Reconnects</span><span class="value ${reconnects > 0 ? 'yellow' : ''}">${reconnects}</span></div>
    <div class="meta-chip"><span class="label">Last Message</span><span class="value live-counter" data-relative="${esc(lastMsgAt || '')}">${fmtRelativeSecs(lastMsgAt)}</span></div>
    <div class="meta-chip"><span class="label">Heartbeat</span><span class="value live-counter" data-relative="${esc(st.lastHeartbeat || '')}">${fmtRelativeSecs(st.lastHeartbeat)}</span></div>
    <div class="meta-chip"><span class="label">Collector</span><span class="value">v${esc(data.collectorVersion || '?')}</span></div>
  </div>`;

  // ── AI Summary ──
  const summary = data.aiSummary || {};
  const lastHourBullets = summary.lastHour || [];
  const last24h = summary.last24h || '';

  if (lastHourBullets.length > 0 || last24h) {
    html += `<div class="summary-section">
      <div class="summary-header">
        <h2>Status Summary</h2>
        <span class="generated">AI-generated ${summary.generatedAt ? fmtRelativeSecs(summary.generatedAt) : 'never'}</span>
      </div>
      <div class="summary-grid">
        <div class="summary-block">
          <h3>Last Hour</h3>
          <ul class="summary-bullets">`;
    for (const bullet of lastHourBullets) {
      html += `<li>${esc(bullet)}</li>`;
    }
    if (lastHourBullets.length === 0) {
      html += `<li style="color:var(--text-dim)">No activity reported</li>`;
    }
    html += `</ul></div>
        <div class="summary-block">
          <h3>Last 24 Hours</h3>
          <div class="summary-24h">${esc(last24h) || '<span style="color:var(--text-dim)">No summary available</span>'}</div>
        </div>
      </div>
    </div>`;
  }

  // ── Token Cards ──
  const ratio = tk.inputOutputRatio || (tk.totalOutput > 0 ? (tk.totalInput / tk.totalOutput).toFixed(1) : '\u2014');
  const oai = tk.openai || {};
  const ant = tk.anthropic || {};
  html += `<div class="cards">
    <div class="card">
      <div class="card-label">Total Tokens</div>
      <div class="card-value">${fmt(tk.total)}</div>
      <div class="card-sub">${fmt(tk.totalInput)} in / ${fmt(tk.totalOutput)} out</div>
      <div class="card-provider-split">
        <span><span class="dot" style="background:var(--green)"></span> OpenAI: ${fmt((oai.input||0)+(oai.output||0))}</span>
        <span><span class="dot" style="background:var(--orange)"></span> Anthropic: ${fmt((ant.input||0)+(ant.output||0))}</span>
      </div>
    </div>
    <div class="card">
      <div class="card-label">Input Tokens</div>
      <div class="card-value">${fmt(tk.totalInput)}</div>
      <div class="card-explainer">Full conversation context re-sent each turn</div>
    </div>
    <div class="card">
      <div class="card-label">Output Tokens</div>
      <div class="card-value">${fmt(tk.totalOutput)}</div>
      <div class="card-explainer">New response generated per turn</div>
    </div>
    <div class="card">
      <div class="card-label">Estimated Cost</div>
      <div class="card-value cost">${fmtCost(tk.estimatedCostUsd)}</div>
      <div class="card-provider-split">
        <span><span class="dot" style="background:var(--green)"></span> OpenAI: ${fmtCost(oai.cost||0)}</span>
        <span><span class="dot" style="background:var(--orange)"></span> Anthropic: ${fmtCost(ant.cost||0)}</span>
      </div>
    </div>
  </div>`;

  // ── Project Timeline (Git Commits) ──
  const commits = data.gitCommits || [];
  if (commits.length > 0) {
    html += `<div class="panel full-width">
      <div class="panel-header">
        <span>Project Timeline</span>
        <span style="font-weight:400;color:var(--text-dim);font-size:12px">${commits.length} commits across ${[...new Set(commits.map(c=>c.repo))].length} repos</span>
      </div>
      <div class="panel-body" style="max-height:400px">
        <ul class="timeline" style="padding:16px 16px 16px 40px">`;
    for (const c of commits.slice(0, 20)) {
      const rc = repoClass(c.repo);
      html += `<li class="timeline-item repo-${rc}">
        <div class="timeline-msg">${esc(c.message)}</div>
        <div class="timeline-meta">
          <span class="timeline-repo repo-${rc}">${esc(c.repo)}</span>
          <span class="timeline-hash">${esc(c.hash)}</span>
          <span>${fmtDateTime(c.time)}</span>
          <span style="color:var(--text-dim)">by ${esc(c.author)}</span>
        </div>
      </li>`;
    }
    html += `</ul></div></div>`;
  }

  // ── Model & Provider Breakdown ──
  html += `<div class="columns">`;

  // Model breakdown
  html += `<div class="panel">
    <div class="panel-header">Token Usage by Model</div>
    <div class="panel-body">
      <table class="breakdown-table"><thead><tr>
        <th>Model</th><th>Input</th><th>Output</th><th>Cost</th><th>Sessions</th>
      </tr></thead><tbody>`;
  for (const [model, d] of Object.entries(models)) {
    const currentTag = d.isCurrent ? '<span class="current-tag">active</span>' : '';
    // Detect provider from model name
    const isAnthropic = model.includes('claude');
    const nameClass = isAnthropic ? 'provider-anthropic' : 'model-name';
    html += `<tr>
      <td class="${nameClass}">${esc(model)}${currentTag}</td>
      <td>${fmt(d.input)}</td><td>${fmt(d.output)}</td>
      <td>${fmtCost(d.cost)}</td><td>${d.sessions}</td>
    </tr>`;
  }
  if (Object.keys(models).length === 0) {
    html += `<tr><td colspan="5" style="color:var(--text-dim);text-align:center;padding:20px">No data yet</td></tr>`;
  }
  html += `</tbody></table></div></div>`;

  // Provider breakdown
  html += `<div class="panel">
    <div class="panel-header">Token Usage by Provider</div>
    <div class="panel-body">
      <table class="breakdown-table"><thead><tr>
        <th>Provider</th><th>Input</th><th>Output</th><th>Cost</th><th>Sessions</th>
      </tr></thead><tbody>`;
  for (const [prov, d] of Object.entries(data.byProvider || {})) {
    const pc = providerClass(prov);
    html += `<tr>
      <td class="model-name provider-${esc(prov)}">${esc(prov)}</td>
      <td>${fmt(d.input)}</td><td>${fmt(d.output)}</td>
      <td>${fmtCost(d.cost)}</td><td>${d.sessions}</td>
    </tr>`;
  }
  if (Object.keys(data.byProvider || {}).length === 0) {
    html += `<tr><td colspan="5" style="color:var(--text-dim);text-align:center;padding:20px">No data yet</td></tr>`;
  }
  html += `</tbody></table></div></div>`;
  html += `</div>`;

  // ── Claude Code Activity ──
  const cc = data.claudeCode || {};
  const ccSessions = cc.sessions || [];
  const ccTokens = cc.totalTokens || {};
  html += `<div class="panel full-width">
    <div class="claude-section-header">
      <span>Claude Code Activity</span>
      <span style="font-weight:400;color:var(--text-dim);font-size:12px">
        ${ccSessions.length} session${ccSessions.length !== 1 ? 's' : ''}
        ${ccTokens.total > 0 ? ' | ' + fmt(ccTokens.total) + ' tokens | ' + fmtCost(cc.totalCost) : ''}
      </span>
    </div>
    <div class="panel-body-tall">`;
  if (ccSessions.length > 0) {
    for (const s of ccSessions) {
      const isOpen = expandedSessions.has(s.id);
      const toolNames = [...new Set((s.toolCalls || []).map(t => t.name))];
      const shortId = s.id.substring(0, 8);
      html += `<div class="cc-session">
        <div class="cc-session-summary" onclick="toggleCcSession('${esc(s.id)}')">
          <div>
            <span class="cc-session-expand ${isOpen ? 'open' : ''}">\u25B6</span>
            <span class="model-name provider-anthropic" style="margin-left:8px">${esc(s.model)}</span>
            <span class="cc-session-meta" style="margin-left:8px">${esc(shortId)}...</span>
            ${toolNames.length > 0 ? '<span class="cc-tool-list" style="display:inline-flex;margin-left:8px">' +
              toolNames.map(tn => '<span class="cc-tool-chip">' + esc(tn) + '</span>').join('') + '</span>' : ''}
          </div>
          <div class="cc-session-meta">
            ${fmtDateTime(s.startTime)} | ${fmtDuration(s.startTime, s.endTime)}
            | ${s.messageCount} msgs | ${fmt(s.totalTokens)} tokens | ${fmtCost(s.estimatedCost)}
          </div>
        </div>
        <div class="cc-session-detail ${isOpen ? 'open' : ''}">`;

      const msgs = s.messages || [];
      if (msgs.length > 0) {
        html += `<div class="cc-conversation">`;
        for (const m of msgs) {
          const roleLabel = m.role === 'tool_result' ? 'tool' : m.role;
          html += `<div class="cc-msg">
            <span class="cc-msg-role ${ccRoleClass(m.role)}">${esc(roleLabel)}</span>
            <div class="cc-msg-text">${esc(m.text)}</div>
          </div>`;
        }
        html += `</div>`;
      }

      const tcs = s.toolCalls || [];
      if (tcs.length > 0) {
        html += `<div class="cc-tool-calls-section">
          <details><summary>${tcs.length} tool call${tcs.length !== 1 ? 's' : ''}</summary>`;
        for (const tc of tcs) {
          html += `<div class="cc-tc-item">
            <span class="event-time" style="font-size:10px">${fmtTime(tc.time)}</span>
            <span class="tool-name" style="font-size:10px">${esc(tc.name)}</span>
            <span class="tool-args" style="font-size:10px">${esc(tc.preview || '')}</span>
          </div>`;
        }
        html += `</details></div>`;
      }
      html += `</div></div>`;
    }
  } else {
    html += `<div class="panel-empty">No Claude Code sessions yet. When ClawdBot invokes Claude Code via the exec tool, activity will appear here.</div>`;
  }
  html += `</div></div>`;

  // ── Tool Calls ──
  const toolCalls = data.toolCalls || [];
  html += `<div class="panel full-width">
    <div class="panel-header">
      <span>Tool Calls</span>
      <span style="font-weight:400;color:var(--text-dim);font-size:12px">${toolCalls.length} calls</span>
    </div>
    <div class="panel-body">`;
  if (toolCalls.length > 0) {
    for (const tc of toolCalls.slice().reverse()) {
      const isClaudeExec = tc.isClaudeExec;
      const nameClass = isClaudeExec ? 'tool-name exec-claude' : 'tool-name';
      const label = isClaudeExec ? tc.name + ' (claude)' : tc.name;
      html += `<div class="tool-item">
        <span class="event-time">${fmtTime(tc.time)}</span>
        <span class="${nameClass}">${esc(label)}</span>
        <span class="tool-args">${esc(tc.argsPreview || '').substring(0, 120)}</span>
      </div>`;
    }
  } else {
    html += `<div class="panel-empty">No tool calls recorded yet</div>`;
  }
  html += `</div></div>`;

  // ── Sessions ──
  const sessions = data.sessions || [];
  html += `<div class="panel full-width">
    <div class="panel-header">
      <span>OpenClaw Sessions</span>
      <span style="font-weight:400;color:var(--text-dim);font-size:12px">${sessions.length} total</span>
    </div>
    <div class="panel-body">
      <table class="sessions-table"><thead><tr>
        <th>Agent</th><th>Channel</th><th>Contact</th><th>Model</th>
        <th>Input</th><th>Output</th><th>Cost</th><th>Messages</th><th>Updated</th>
      </tr></thead><tbody>`;
  for (const s of sessions) {
    const chClass = s.channel === 'whatsapp' ? 'channel-whatsapp' : 'channel-web';
    html += `<tr>
      <td>${esc(s.agent)}</td>
      <td><span class="channel-badge ${chClass}">${esc(s.channel)}</span></td>
      <td>${esc(s.contact)}</td>
      <td class="model-name">${esc(s.model)}</td>
      <td>${fmt(s.inputTokens)}</td><td>${fmt(s.outputTokens)}</td>
      <td>${fmtCost(s.estimatedCost)}</td>
      <td>${s.messageCount || 0}</td>
      <td class="live-counter" data-relative="${esc(s.updatedAt ? new Date(s.updatedAt).toISOString() : '')}">${fmtRelativeSecs(s.updatedAt ? new Date(s.updatedAt).toISOString() : null)}</td>
    </tr>`;
  }
  if (sessions.length === 0) {
    html += `<tr><td colspan="9" style="color:var(--text-dim);text-align:center;padding:20px">No active sessions</td></tr>`;
  }
  html += `</tbody></table></div></div>`;

  // ── Recent Messages ──
  const allMsgs = sessions.flatMap(s =>
    (s.messages || []).map(m => ({ ...m, agent: s.agent, contact: s.contact }))
  ).sort((a, b) => new Date(b.time) - new Date(a.time)).slice(0, 15);

  if (allMsgs.length > 0) {
    html += `<div class="panel full-width">
      <div class="panel-header">Recent Messages</div>
      <div class="panel-body">`;
    for (const m of allMsgs) {
      html += `<div class="msg-item">
        <span class="event-time">${fmtTime(m.time)}</span>
        <span class="msg-role ${m.role === 'user' ? 'role-user' : 'role-assistant'}">${esc(m.role)}</span>
        <div>
          <div class="msg-text">${esc(m.text)}</div>
          <div class="msg-meta">${esc(m.model || '')} ${m.tokens ? '| ' + fmt(m.tokens) + ' tokens' : ''}</div>
        </div>
      </div>`;
    }
    html += `</div></div>`;
  }

  // ── Event Log ──
  const events = data.recentEvents || [];
  html += `<div class="panel full-width">
    <div class="panel-header">
      <span>Event Log</span>
      <span style="font-weight:400;color:var(--text-dim);font-size:12px">${events.length} events</span>
    </div>
    <div class="panel-body">
      <ul class="event-list">`;
  for (const ev of events) {
    html += `<li class="event-item">
      <span class="event-time">${fmtTime(ev.time)}</span>
      <span class="event-badge ${badgeClass(ev.category)}">${esc(ev.category)}</span>
      <span class="event-msg">${esc(ev.message)}</span>
    </li>`;
  }
  if (events.length === 0) {
    html += `<li class="event-item" style="justify-content:center;color:var(--text-dim)">No events recorded</li>`;
  }
  html += `</ul></div></div>`;

  document.getElementById('app').innerHTML = html;
}

// ── Live-ticking counters ──
function updateLiveCounters() {
  document.querySelectorAll('.live-counter[data-relative]').forEach(el => {
    const iso = el.getAttribute('data-relative');
    if (iso) {
      el.textContent = (el.textContent.startsWith('Updated') ? 'Updated ' : '') + fmtRelativeSecs(iso);
    }
  });
}

async function fetchData() {
  try {
    const resp = await fetch('data.json?t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    data = await resp.json();
    dataFetchedAt = Date.now();
    render();
  } catch (e) {
    if (!data) {
      document.getElementById('app').innerHTML =
        '<div class="error-banner">Failed to load dashboard data: ' + e.message +
        '<br>The collector may not be running yet. Data will appear once the first collection completes.</div>';
    }
  }
}

// 1-second tick: update live counters + refresh bar
setInterval(() => {
  countdown--;
  const bar = document.getElementById('refreshBar');
  if (bar) bar.style.width = (Math.max(0, countdown) / REFRESH_INTERVAL * 100) + '%';
  if (countdown <= 0) {
    countdown = REFRESH_INTERVAL;
    fetchData();
  }
  updateLiveCounters();
}, 1000);

fetchData();
</script>
</body>
</html>
